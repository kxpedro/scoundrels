services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scoundrels
      POSTGRES_PASSWORD: scoundrels
      POSTGRES_DB: scoundrels
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoundrels"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
